<style>
:root{
  --bg:#000; --app:#0d0d10; --surface:#1d1d21; --surface2:#26262b; --line:#34343a;
  --text:#f4f2f8; --muted:#a3a1ab; --purple:#9a2bff; --violet:#6527ff;
  --grad:linear-gradient(90deg,#a31dff 0%,#6527ff 100%);
  --win:#4fe08a; --winbg:rgba(79,224,138,.12); --lose:#ff5a6e; --losebg:rgba(255,90,110,.12);
  --void:#ffc24a; --voidbg:rgba(255,194,74,.12); --live:#ff2d55;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{--bg:#000;--app:#0d0d10;--surface:#1d1d21;--surface2:#26262b;--line:#34343a;--text:#f4f2f8;--muted:#a3a1ab}
:root{color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.app{position:relative;width:100%;max-width:430px;height:100%;margin:0 auto;background:var(--app);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:640px){body{display:flex;align-items:center;justify-content:center;padding:24px 0}.app{height:min(844px,100%);width:auto;max-width:none;aspect-ratio:390/844;border-radius:36px;border:1px solid var(--line);box-shadow:0 0 0 8px #18181c,0 30px 80px rgba(101,39,255,.25)}}
/* top bar */
.top{padding:14px 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(154,43,255,.22),transparent)}
.word{font-weight:900;font-style:italic;font-size:22px;letter-spacing:-.5px;line-height:1}
.top .sub{font-size:13px;color:var(--muted);margin-left:auto}
.av{width:34px;height:34px;border-radius:10px;flex:none;background:var(--grad);display:inline-grid;place-items:center}.av img{width:46%;height:auto;display:block;filter:drop-shadow(0 1px 1px rgba(40,0,90,.25))}
.steps{display:flex;gap:6px;padding:12px 18px 4px}
.steps div{flex:1}
.steps .bar{height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}
.steps .bar i{display:block;height:100%;width:0;background:var(--grad);transition:width .35s ease}
.steps span{display:block;font-size:12px;color:var(--muted);margin-top:5px;font-weight:600}
.steps .on span{color:var(--text)}
/* main */
main{flex:1;overflow-y:auto;padding:16px 18px 24px;-webkit-overflow-scrolling:touch}
.bot{display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:12px 14px;font-size:15.5px}
.bubble b{color:var(--text)}
h1.big{font-weight:900;font-style:italic;font-size:40px;line-height:.95;letter-spacing:-1px;margin:24px 0 12px}
h2{font-weight:800;font-style:italic;font-size:26px;line-height:1;margin:4px 0 10px;letter-spacing:-.4px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.card .k{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px}
.example{background:var(--surface2);border-radius:12px;padding:12px;margin-top:12px;font-size:14.5px}
.example strong{color:var(--win)}
.dots{display:flex;gap:5px;justify-content:center;margin:6px 0 2px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:all .25s}
.dots i.on{width:18px;background:var(--purple)}
/* footer */
.foot{padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;gap:10px;background:var(--app)}
.btn{flex:1;border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:16px;background:var(--grad);color:#fff}
.endbtns{display:flex;flex-direction:column;gap:8px;width:100%}
.btn.primary{text-align:center;text-decoration:none;display:block;padding:18px 16px;font-size:18px;box-shadow:0 8px 24px rgba(101,39,255,.35)}
.endbtns .btn.ghost{padding:12px;font-size:15px;background:transparent;border:1px solid var(--line)}
.btn.ghost{background:var(--surface2);color:var(--text);flex:0 0 auto}
.btn:disabled{opacity:.4;cursor:default}
/* sports */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sport{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px}
.sport .e{font-size:26px;line-height:1}
.sport b{font-size:17px}
.sport small{color:var(--muted);font-size:13px}
.sport[aria-pressed="true"]{border-color:var(--purple);background:linear-gradient(160deg,rgba(154,43,255,.25),var(--surface) 70%)}
/* ticket */
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:12px 0}
.t-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface2);font-size:13px;font-weight:700}
.t-head .pill{font-size:11.5px;padding:3px 8px;border-radius:20px;background:var(--grad);color:#fff}
.leg{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.leg:first-of-type{border-top:0}
.leg .info{flex:1;min-width:0}
.leg .m{font-size:12.5px;color:var(--muted)}
.leg .pick{font-weight:700;font-size:15px}
.leg .tag{font-size:10.5px;font-weight:700;border:1px solid var(--purple);color:var(--purple);border-radius:5px;padding:0 4px;margin-left:4px;vertical-align:2px}
.odds{font-weight:700;background:var(--surface2);border-radius:8px;padding:6px 9px;font-size:14px}
.st{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;background:var(--surface2);color:var(--muted);transition:all .3s}
.st.win{background:var(--winbg);color:var(--win)} .st.lose{background:var(--losebg);color:var(--lose)} .st.void{background:var(--voidbg);color:var(--void)}
.t-foot{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px dashed var(--line);font-size:13.5px}
.t-foot b{font-size:15px}
.live{color:var(--live);font-weight:700;font-size:12px}
.scen{font-size:14.5px;background:var(--surface2);border-left:3px solid var(--purple);border-radius:4px 12px 12px 4px;padding:10px 12px;margin:8px 0}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px}
.opt.right{border-color:var(--win);background:var(--winbg)}
.opt.wrong{border-color:var(--lose);background:var(--losebg)}
.opt:disabled{cursor:default}
.why{margin-top:12px;font-size:15px}
.why .v{font-weight:800}
.qcount{font-size:13px;color:var(--muted);font-weight:600}
.score{font-weight:900;font-style:italic;font-size:64px;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 12px;font-size:13.5px;font-weight:600}
.rg{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
/* chat */
.fab{position:absolute;right:16px;bottom:84px;border:0;border-radius:24px;padding:8px 14px 8px 8px;display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--purple);font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:5}
.fab .av{width:28px;height:28px;border-radius:8px}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;z-index:10}
.sheet.open{display:block}
.panel{position:absolute;left:0;right:0;bottom:0;height:82%;background:var(--app);border-radius:22px 22px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.steps .bar i,.st,.dots i{transition:none}}
.p-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.p-head .x{margin-left:auto;background:var(--surface2);border:0;border-radius:10px;width:34px;height:34px;font-size:18px}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:15px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--grad);color:#fff;border-radius:16px 16px 4px 16px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:4px 16px 16px 16px}
.msg.note{align-self:center;background:transparent;color:var(--muted);font-size:13px;text-align:center}
.composer{display:flex;gap:8px;padding:10px 12px 14px;border-top:1px solid var(--line)}
.composer input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--text);font:inherit;font-size:15px;min-width:0}
.composer button{border:0;border-radius:14px;padding:0 16px;background:var(--grad);color:#fff;font-weight:700}
.fade{animation:fd .3s ease}
@keyframes fd{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
/* ===== FX ===== */
.fx{position:absolute;inset:0;pointer-events:none;z-index:20;display:flex;align-items:center;justify-content:center}
.fx canvas{position:absolute;inset:0;width:100%;height:100%}
.stage{position:relative;width:300px;height:230px;animation:stageIn .25s ease-out both}
.stage.out{animation:stageOut .35s ease-in both}
@keyframes stageIn{from{opacity:0;transform:scale(.85)}}
@keyframes stageOut{to{opacity:0;transform:scale(1.05)}}
.fx.dim{background:rgba(5,4,10,.78);animation:dimIn .2s ease-out both}
.fx.dim.bye{animation:dimOut .35s ease-in both}
@keyframes dimIn{from{opacity:0}}@keyframes dimOut{to{opacity:0}}
.goal{position:absolute;left:0;top:10px;width:300px;height:150px;overflow:visible}
.goal .frame{stroke:#fff;stroke-width:6;fill:none;stroke-linecap:round}
.goal .net{stroke:rgba(255,255,255,.35);stroke-width:1}
.goal .grass{fill:#1f6b3a}
.netg{transform-origin:150px 80px;transform-box:view-box}
.netg.bulge{animation:bulge .5s ease-out .55s both}
@keyframes bulge{40%{transform:scale(1.06,1.1) translateY(-2px)}100%{transform:none}}
.post{transition:stroke .2s}
.post.hit{animation:postHit .5s ease-out .5s both}
@keyframes postHit{30%{stroke:var(--void);stroke-width:9}100%{stroke:#fff}}
.goal.shake{animation:gshake .4s ease-in-out .55s both}
@keyframes gshake{20%{transform:translateX(4px)}40%{transform:translateX(-4px)}60%{transform:translateX(3px)}80%{transform:translateX(-2px)}}
.ball{position:absolute;left:0;top:0;font-size:38px;line-height:1;will-change:transform;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.shout{position:absolute;left:-40px;right:-40px;bottom:0;text-align:center;white-space:nowrap;font-weight:900;font-style:italic;font-size:42px;padding-right:.15em;letter-spacing:-1px;line-height:1;color:#fff;opacity:0}
.shout.good{background:linear-gradient(90deg,#c46bff,#7d5bff,#4fe08a);-webkit-background-clip:text;background-clip:text;color:transparent}
.shout.bad{color:var(--void)}
.shout.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-6deg)}to{opacity:1;transform:none}}
.big-emoji{position:absolute;left:50%;top:40px;font-size:84px;line-height:1;transform:translateX(-50%)}
.big-emoji.win{animation:eWin .9s cubic-bezier(.2,1.3,.4,1) both}
@keyframes eWin{0%{transform:translate(-50%,120px) scale(.4) rotate(0)}60%{transform:translate(-50%,-10px) scale(1.15) rotate(340deg)}100%{transform:translate(-50%,0) scale(1) rotate(360deg)}}
.big-emoji.lose{animation:eLose .9s ease-out both}
@keyframes eLose{0%{transform:translate(-50%,120px) scale(.5)}45%{transform:translate(-50%,0) scale(1)}60%{transform:translate(-45%,0) rotate(12deg)}75%{transform:translate(-55%,0) rotate(-12deg)}100%{transform:translate(-50%,40px) rotate(0);opacity:.6}}
/* micro-interactions */
.opt{transition:transform .12s ease,border-color .2s,background .2s}
.opt:not(:disabled):active{transform:scale(.97)}
.opt.right{animation:okPulse .5s ease-out}
@keyframes okPulse{40%{transform:scale(1.03)}}
.opt.wrong{animation:noShake .4s ease-in-out}
@keyframes noShake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.st.win,.st.lose,.st.void{animation:stIn .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes stIn{from{transform:scale(.4);opacity:0}}
.sport{transition:transform .15s ease,border-color .2s}
.sport:active{transform:scale(.96)}
.sport[aria-pressed="true"] .e{animation:bounce .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes bounce{40%{transform:translateY(-8px) scale(1.15)}}
.score{display:inline-block;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@media (prefers-reduced-motion:reduce){
  .stage,.netg.bulge,.post.hit,.goal.shake,.shout.pop,.big-emoji,.opt.right,.opt.wrong,.st.win,.st.lose,.st.void,.sport[aria-pressed="true"] .e,.score{animation:none!important}
  .shout{opacity:1}
}

.skip{margin-left:auto;position:relative;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;text-decoration:none;color:#fff;font-weight:700;font-size:13.5px;padding:9px 13px;border-radius:999px;background:var(--grad);box-shadow:0 0 0 0 rgba(154,43,255,.6);animation:skipGlow 2.8s ease-in-out 1.2s infinite;transition:transform .15s}
.skip:active{transform:scale(.95)}
.skip span{transition:transform .2s}.skip:hover span{transform:translateX(3px)}
.skip[hidden]{display:none}
@keyframes skipGlow{0%,70%,100%{box-shadow:0 0 0 0 rgba(154,43,255,0)}35%{box-shadow:0 0 0 6px rgba(154,43,255,.28)}}
@media (max-width:380px){.top{gap:8px;padding-left:14px;padding-right:14px}.skip{font-size:12.5px;padding:8px 11px}.word{font-size:19px}.top .av{width:30px;height:30px}}
@media (prefers-reduced-motion:reduce){.skip{animation:none}}
.back{width:34px;height:34px;margin-left:-6px;border:0;border-radius:10px;background:transparent;color:var(--text);display:grid;place-items:center;flex:none;transition:background .15s}
.back:hover{background:var(--surface2)}.back:active{transform:scale(.92)}
.back.off{visibility:hidden}
.foot{flex-direction:column;gap:8px}
.foot .row{display:flex;gap:10px}
.skipcta{display:block;text-align:center;text-decoration:none;color:var(--text);font-weight:700;font-size:15px;padding:11px 14px;border-radius:14px;border:1.5px solid var(--purple);background:rgba(154,43,255,.08);transition:background .15s,transform .12s}
.skipcta:hover{background:rgba(154,43,255,.16)}.skipcta:active{transform:scale(.98)}

/* ===== HOME (entry point) ===== */
.home{position:absolute;inset:0;z-index:20;background:#000;overflow:hidden}
.home[hidden]{display:none}
.home-scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.home-scroll::-webkit-scrollbar{display:none}
.home-img{display:block;width:100%;height:auto;margin-top:-1px}
.home-top{height:28px;background:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASwAAAABCAIAAADrWgR+AAAAnklEQVR42o2QsQEDIQwDT1+kziTZf7oohTHw8ECgEfLZCPR+fYRASEUgSRDHCxAXqGzUeAtAnYmABEh/EgJHuZgxhcKQ8OzkMSZUqmGjE8pj9b4qsfA1jFiPW14x3bMnD0DGkHBNyOIVq5mRRrucf4b0ltQJOId8flsrCHwDQsffuJkGYbsy2eUCuzY+CTfHOLvct7sz7U6nYwxfd9Uf4ENeT6UqxB0AAAAASUVORK5CYII=) 0 0/100% 100% no-repeat}
.home-pad{height:calc(16.5vw + 90px);max-height:170px}
.home-dock{position:absolute;left:0;right:0;bottom:0;padding-bottom:5.333%;pointer-events:none;display:flex;flex-direction:column}
.home-nav{display:block;width:100%;height:auto;pointer-events:auto}
.pleca{pointer-events:auto;margin:0 4.3% 10px;display:flex;align-items:center;gap:4px;padding:5px 5px 5px 6px;border-radius:999px;border:1px solid transparent;
  background:linear-gradient(rgba(26,22,34,.94),rgba(26,22,34,.94)) padding-box,linear-gradient(90deg,#a31dff,#6527ff) border-box;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 8px 24px rgba(101,39,255,.28);
  font-family:"Red Hat Display","Barlow",system-ui,sans-serif;color:#f4f2f8;animation:plecaIn .45s cubic-bezier(.2,.8,.2,1) .35s both}
.pleca[hidden]{display:none}
.pleca.closing{animation:plecaOut .22s ease forwards}
.pleca-go{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:transparent;border:0;padding:2px 4px 2px 0;text-align:left;color:#f4f2f8}
.pleca-go .av{width:30px;height:30px;border-radius:50%}
.pleca-t{flex:1;min-width:0;font-weight:600;font-size:13px;letter-spacing:-.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pleca-go svg{flex:none;color:#b98cff}
.pleca-x{flex:none;width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,255,255,.08);color:#a3a1ab;display:grid;place-items:center}
.pleca-x:hover{background:rgba(255,255,255,.14);color:#f4f2f8}
.pleca button:focus-visible{outline:2px solid #9a2bff;outline-offset:2px}
@keyframes plecaIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes plecaOut{to{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion: reduce){.pleca,.pleca.closing{animation:none}}
/* secondary "Estoy listo para jugar" */
.foot .stack{display:flex;flex-direction:column;gap:8px;width:100%}
.btn.sec{background:transparent;color:var(--text);border:1.5px solid rgba(154,43,255,.55);padding:12px 16px;font-size:15px}
.btn.sec:hover{background:rgba(154,43,255,.1)}
</style>

<body>
<div class="app" id="app">

/* ===== FX ===== */
const RM=matchMedia('(prefers-reduced-motion: reduce)');
const appEl=document.getElementById('app');
function fxLayer(){const d=document.createElement('div');d.className='fx';d.setAttribute('aria-hidden','true');appEl.appendChild(d);return d}

function confetti(ms=1800,count=140){
  if(RM.matches)return;
  const layer=fxLayer(),c=document.createElement('canvas');layer.appendChild(c);
  const r=appEl.getBoundingClientRect(),dpr=devicePixelRatio||1;
  c.width=r.width*dpr;c.height=r.height*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
  const cols=['#a31dff','#6527ff','#c46bff','#ffffff','#4fe08a','#ffc24a'];
  const P=Array.from({length:count},()=>({x:r.width/2+(Math.random()-.5)*60,y:r.height*.45,vx:(Math.random()-.5)*11,vy:-Math.random()*12-4,
    w:6+Math.random()*6,h:4+Math.random()*5,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  (function f(t){const k=(t-t0)/ms;x.clearRect(0,0,r.width,r.height);
    P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
      x.save();x.globalAlpha=Math.max(0,1-k*k);x.translate(p.x,p.y);x.rotate(p.rot);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
    k<1?requestAnimationFrame(f):layer.remove()})(t0);
}

const NET=(()=>{let s='';for(let i=1;i<13;i++)s+=`<line class="net" x1="${20+i*20}" y1="20" x2="${20+i*20}" y2="140"/>`;for(let j=1;j<6;j++)s+=`<line class="net" x1="20" y1="${20+j*20}" x2="280" y2="${20+j*20}"/>`;return s})();
function goalScene(scored){
  const layer=fxLayer();layer.classList.add('dim');
  layer.innerHTML=`<div class="stage"><svg class="goal ${scored?'':'shake'}" viewBox="0 0 300 150">
    <rect class="grass" x="-10" y="140" width="320" height="10" rx="3"/>
    <g class="netg ${scored?'bulge':''}">${NET}</g>
    <path class="frame" d="M20 140 V20 H280 V140"/>
    <line class="frame post ${scored?'':'hit'}" x1="280" y1="20" x2="280" y2="140"/>
  </svg><span class="ball">⚽</span><div class="shout ${scored?'good':'bad'}">${scored?'¡GOOOL!':'¡Al palo!'}</div></div>`;
  const ball=layer.querySelector('.ball'),shout=layer.querySelector('.shout'),stage=layer.querySelector('.stage');
  if(RM.matches){ball.remove();finish(layer,stage,900);return}
  const k=scored
    ?[{transform:'translate(131px,186px) scale(1) rotate(0)'},{transform:'translate(200px,60px) scale(.62) rotate(540deg)',offset:.85},{transform:'translate(206px,66px) scale(.6) rotate(560deg)'}]
    :[{transform:'translate(131px,186px) scale(1) rotate(0)'},{transform:'translate(262px,70px) scale(.65) rotate(400deg)',offset:.5},{transform:'translate(200px,120px) scale(.7) rotate(300deg)',offset:.75},{transform:'translate(150px,200px) scale(.8) rotate(200deg)',opacity:.5}];
  ball.animate(k,{duration:scored?650:1000,easing:'cubic-bezier(.3,.7,.4,1)',fill:'forwards'});
  setTimeout(()=>{shout.classList.add('pop');if(scored)confetti()},scored?560:520);
  finish(layer,stage,1900);
}

function emojiScene(key,ok){
  const t=THEMES[key]||THEMES.basic,layer=fxLayer();layer.classList.add('dim');
  layer.innerHTML=`<div class="stage"><span class="big-emoji ${ok?'win':'lose'}">${t.e}</span><div class="shout ${ok?'good':'bad'}">${ok?t.win:t.lose}</div></div>`;
  const shout=layer.querySelector('.shout'),stage=layer.querySelector('.stage');
  setTimeout(()=>{shout.classList.add('pop');if(ok)confetti()},RM.matches?0:420);
  finish(layer,stage,1700);
}
function finish(layer,stage,ms){setTimeout(()=>{stage.classList.add('out');layer.classList.add('bye');setTimeout(()=>layer.remove(),350)},ms)}
function celebrate(ok,sport){
  document.querySelectorAll('.fx.dim').forEach(n=>n.remove());
  sport==='futbol'?goalScene(ok):emojiScene(sport||'basic',ok);
}
function countUp(el,to,ms=700){if(!el)return;if(RM.matches||!to){el.textContent=el.dataset.final;return}
  const t0=performance.now(),tot=el.dataset.total;(function f(t){const k=Math.min(1,(t-t0)/ms);el.textContent=Math.round(to*k)+'/'+tot;k<1&&requestAnimationFrame(f)})(t0)}

const READY='<button class="btn sec" data-ready>Estoy listo, llévame a jugar</button>';
function bindReady(){foot.querySelectorAll('[data-ready]').forEach(el=>el.onclick=goHome)}
/* ===== HOME ===== */
const homeEl=$('#home'),plecaEl=$('#pleca');
$('#plecaAv').src=DMARK;
function goHome(){
  Object.assign(S,{i:0,sport:null,bScore:0,sScore:0,answered:false});
  appEl.querySelectorAll('.fx').forEach(n=>n.remove());
  main.innerHTML='';foot.innerHTML='';setSteps(0,0);setBack(null);
  plecaEl.hidden=false;plecaEl.classList.remove('closing');
  plecaEl.style.animation='none';void plecaEl.offsetWidth;plecaEl.style.animation='';
  $('#homeScroll').scrollTop=0;homeEl.hidden=false;fitPleca();
}
function openOnboarding(){homeEl.hidden=true;welcome();$('#main').focus?.()}
$('#plecaGo').onclick=openOnboarding;
function fitPleca(){const t=plecaEl.querySelector('.pleca-t');if(!t||plecaEl.hidden)return;let f=13;t.style.fontSize=f+'px';
  while(t.scrollWidth>t.clientWidth&&f>11){f-=.5;t.style.fontSize=f+'px'}}
document.fonts&&document.fonts.ready.then(fitPleca);addEventListener('resize',fitPleca);setTimeout(fitPleca,50);
$('#plecaX').onclick=()=>{if(RM.matches){plecaEl.hidden=true;return}plecaEl.classList.add('closing');setTimeout(()=>{plecaEl.hidden=true},220)};
const toTop=()=>{main.scrollTop=0};

const STLABEL={pend:'Pendiente',win:'Ganada',lose:'Perdida',void:'Cancelada'};
function ticket(t,states){
  const st=states||t.legs.map(()=>'pend');
  const live=t.legs.filter((l,k)=>st[k]!=='void');
  const odds=live.reduce((a,l)=>a*l.o,1);
  const rows=t.legs.map((l,k)=>`<div class="leg"><div class="info"><div class="m">${l.ev}</div><div class="pick">${l.p}${l.tag?`<span class="tag">${l.tag}</span>`:''}</div><div class="m">${l.m}</div></div><span class="odds">${l.o.toFixed(2)}x</span><span class="st ${st[k]}">${STLABEL[st[k]]}</span></div>`).join('');
  return `<div class="ticket fade" aria-label="Ticket de ejemplo"><div class="t-head"><span>${t.type}${t.legs.length>1?` · ${t.legs.length} selecciones`:''}</span><span class="pill">Draftea</span></div>${rows}
  <div class="t-foot"><span class="muted">Apuesta ${fmt(t.stake)} · ${live.length?odds.toFixed(2)+'x':'—'}</span><span>Pago potencial <b>${fmt(live.length?t.stake*odds:t.stake)}</b></span></div></div>`;
}

/* generic quiz screen */
function quizScreen({q,idx,total,intro,label,onAnswer,next,nextLabel,progress,sport}){
  S.answered=false;toTop();
  /* shuffle options so the correct one isn't always in the same spot */
  const ord=q.o.map((_,k)=>k);
  do{for(let k=ord.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[ord[k],ord[j]]=[ord[j],ord[k]]}}
  while(ord.length>2&&ord.indexOf(q.c)===S.lastC);
  const opts=ord.map(k=>q.o[k]),cc=ord.indexOf(q.c);S.lastC=cc;
  main.innerHTML=`${idx===0&&intro?bot(intro):''}
  <div class="qcount">${label} · ${idx+1} de ${total}</div>
  <div id="tk">${ticket(q.ticket)}</div>
  <div class="scen"><span class="live">● Lo que pasó</span><br>${q.scen}</div>
  <h2 style="font-size:22px">${q.q}</h2>
  <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>
  <div id="why"></div>`;
  buttons([{t:'Elige una respuesta',dis:true,fn:()=>{}}]);
  main.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(S.answered)return;S.answered=true;
    const k=+b.dataset.k,ok=k===cc;onAnswer(ok);celebrate(ok,sport);
    main.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===cc)x.classList.add('right');else if(j===k)x.classList.add('wrong')});
    $('#tk').innerHTML=ticket(q.ticket,q.after);
    $('#why').innerHTML=`<div class="why fade"><span class="v" style="color:var(${ok?'--win':'--lose'})">${ok?'¡Exacto!':'Casi.'}</span> ${q.why}</div>`;
    progress&&progress();
    buttons([{t:nextLabel,fn:next}]);
    $('#why').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});
  });
}

/* WELCOME */
function welcome(){
  setSteps(0,0);toTop();
  main.innerHTML=`<h1 class="big fade">¿Listo para aprender a jugar?</h1>
  ${bot('Te voy a explicar cómo funcionan tus apuestas en Draftea en tres pasos cortos: <b>lo básico</b>, <b>las reglas de tu deporte favorito</b> y un <b>reto con tickets</b>.')}
  ${bot('Al final de cada parte te pongo a prueba con casos reales.')}
  <p class="rg">Juego prohibido para menores de edad. Juega con responsabilidad: la idea es divertirte.</p>`;
  buttons([{t:'Atrás',fn:goHome},{t:'Empezar',fn:()=>{S.i=0;basics()}}]);
}

/* STEP 1: cards + quiz */
function basics(){
  const c=BASICS[S.i];setSteps(1,(S.i+1)/NB);toTop();
  main.innerHTML=`${S.i===0?bot('Arranquemos con lo que necesitas saber antes de tu primer ticket.'):''}
  <div class="card fade"><div class="k">${S.i+1} de ${BASICS.length}</div><h2>${c.t}</h2><p>${c.b}</p><div class="example">${c.ex}</div></div>
  ${dots(BASICS.length,S.i)}`;
  buttons([{t:'Atrás',ghost:true,fn:()=>{S.i?(S.i--,basics()):welcome()}},
    {t:S.i<BASICS.length-1?'Siguiente':'Ponerme a prueba',fn:()=>{S.i<BASICS.length-1?(S.i++,basics()):(S.i=0,S.bScore=0,basicQuiz())}}]);
}
function basicQuiz(){
  const last=S.i===BASIC_QUIZ.length-1;setSteps(1,(BASICS.length+S.i)/NB);
  quizScreen({q:BASIC_QUIZ[S.i],idx:S.i,total:BASIC_QUIZ.length,label:'Lo básico',
    intro:'A ver qué tanto te quedó. Una pregunta por cada tema.',
    onAnswer:ok=>{if(ok)S.bScore++},progress:()=>setSteps(1,(BASICS.length+S.i+1)/NB),
    nextLabel:last?'Elegir mi deporte':'Siguiente',next:()=>{last?pick():(S.i++,basicQuiz())}});
}

/* STEP 2 */
function pick(){
  setSteps(2,.1);toTop();
  const n=BASIC_QUIZ.length;
  main.innerHTML=`${bot(`Sacaste <b>${S.bScore} de ${n}</b> en lo básico. ${S.bScore===n?'¡Perfecto!':'¡Bien!'} Ahora dime, <b>¿cuál es tu deporte favorito?</b>`)}
  <div class="grid fade" role="group" aria-label="Deportes">${Object.entries(SPORTS).map(([k,s])=>`<button class="sport" data-s="${k}" aria-pressed="${S.sport===k}"><span class="e">${s.e}</span><b>${s.n}</b><small>${s.s}</small></button>`).join('')}</div>`;
  main.querySelectorAll('.sport').forEach(b=>b.onclick=()=>{S.sport=b.dataset.s;main.querySelectorAll('.sport').forEach(x=>x.setAttribute('aria-pressed',x===b));buttons(pickBtns())});
  buttons(pickBtns());
}
const pickBtns=()=>[{t:S.sport?`Aprender ${SPORTS[S.sport].n}`:'Elige un deporte',dis:!S.sport,fn:()=>{S.i=0;lesson()}}];

function lesson(){
  const sp=SPORTS[S.sport],c=sp.lessons[S.i];setSteps(2,.1+.9*(S.i+1)/sp.lessons.length);toTop();
  main.innerHTML=`${S.i===0?bot(`Buena elección ${sp.e}. Esto es lo que más importa cuando apuestas en <b>${sp.n}</b>.`):''}
  <div class="card fade"><div class="k">${sp.e} ${sp.n} · ${S.i+1} de ${sp.lessons.length}</div><h2>${c.t}</h2><p>${c.b}</p><div class="example">${c.ex}</div></div>
  ${dots(sp.lessons.length,S.i)}`;
  buttons([{t:'Atrás',ghost:true,fn:()=>{S.i?(S.i--,lesson()):pick()}},
    {t:S.i<sp.lessons.length-1?'Siguiente':'Ir al reto',fn:()=>{S.i<sp.lessons.length-1?(S.i++,lesson()):(S.i=0,S.sScore=0,quiz())}}]);
}

/* STEP 3 */
function quiz(){
  const sp=SPORTS[S.sport],last=S.i===sp.quiz.length-1;setSteps(3,S.i/sp.quiz.length);
  quizScreen({sport:S.sport,q:sp.quiz[S.i],idx:S.i,total:sp.quiz.length,label:`${sp.e} ${sp.n}`,
    intro:'Último reto. Te muestro un ticket y lo que pasó en el partido: tú me dices cómo se liquida.',
    onAnswer:ok=>{if(ok)S.sScore++},progress:()=>setSteps(3,(S.i+1)/sp.quiz.length),
    nextLabel:last?'Ver mi resultado':'Siguiente caso',next:()=>{last?done():(S.i++,quiz())}});
}
function done(){
  const sp=SPORTS[S.sport],tot=sp.quiz.length,sc=S.sScore;setSteps(4,1);toTop();
  const msg=sc===tot?'Dominas las reglas. Ya estás listo para tu primer ticket.':sc>0?'Vas bien. Repasa el caso que fallaste y estás listo.':'Nada mal para empezar. Vale la pena repasar las reglas antes de apostar.';
  main.innerHTML=`<div class="card fade" style="text-align:center;margin-top:20px"><div class="k">Tu resultado en ${sp.n}</div><div class="score" id="score" data-total="${tot}" data-final="${sc}/${tot}">0/${tot}</div><p style="margin-top:10px">${msg}</p></div>
  ${bot('Ya tienes lo necesario para empezar. Crea tu primera entrada en Draftea o, si quieres, aprende las reglas de otro deporte.')}
  <p class="rg">Juego prohibido para menores de edad. Juega con responsabilidad. Las reglas completas están en draftea.mx.</p>`;
  setBack(null);foot.innerHTML=`<div class="endbtns"><button class="btn primary" data-ready>Crear mi primera entrada</button>${READY}<button class="btn ghost" id="other">Ir a otro deporte</button></div>`;bindReady();
  $('#other').onclick=()=>{S.sport=null;pick()};
  setTimeout(()=>{countUp($('#score'),sc);if(sc===tot)setTimeout(()=>confetti(2200,180),650)},250);
}
goHome();

</script>
</body>
</html>
